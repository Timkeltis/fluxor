name: Build fluxor-amd64

# push 触发的构建没有手动版本号输入，故注入 dev-<短哈希> 作为版本标识。
# 正式发版请使用 Release workflow（可输入版本号）。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'


jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 设置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: 确定版本号（dev-<短哈希>）
        id: version
        run: |
          V="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "构建版本号: $V"

      - name: 构建（前端 + 同步 + 后端，注入版本号）
        run: make V=${{ steps.version.outputs.VERSION }}

      - name: 上传 fluxor 二进制作为 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: fluxor
          path: fluxor
