name: Build and Release fluxor

# 手动触发时可输入版本号；留空则回退为 git describe。
# 版本号经 -ldflags 注入 buildinfo.Version（不再由前端 package.json 提供）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）。留空则使用 git describe --tags --always'
        required: false
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 设置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: 确定版本号
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(git describe --tags --always)
          fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "构建版本号: $V"

      - name: 构建（前端 + 同步 + 后端，注入版本号）
        run: make V=${{ steps.version.outputs.VERSION }}

      - name: 重命名产物
        run: mv fluxor fluxor-${{ matrix.arch }}

      - name: 上传 fluxor-${{ matrix.arch }} 作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fluxor-${{ matrix.arch }}
          path: fluxor-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出源码（用于读取版本号与 commit 日志）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: get_version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(git describe --tags --always)
          fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "发布版本号: $V"

      - name: 生成 Release Notes（从上一个 tag 到现在的完整 commit 消息）
        id: get_notes
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            NOTES=$(git log ${LAST_TAG}..HEAD --pretty=format:"%B")
          else
            NOTES=$(git log --pretty=format:"%B")
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 下载所有构建产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_notes.outputs.NOTES }}
          files: artifacts/**/fluxor-*
          draft: false
          prerelease: false
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
